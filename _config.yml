# 源目录配置
source: docs

title: "PPT"
description: "Phil Fan 的 PPT 模板、规则、技能库"

remote_theme: jekyll/minima@d4d779a

# 作者信息
author:
  name: Phil Fan
  email: "hw.phil.fan@gmail.com"

# 让 markdown 正常渲染
markdown: kramdown

# GitHub Pages 推荐设置
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# 控制页面生成和导航
defaults:
  # 排除子目录的页面不出现在导航栏
  - scope:
      path: "bp"
    values:
      nav_exclude: true
  - scope:
      path: "extra"
    values:
      nav_exclude: true
  - scope:
      path: "templates"
    values:
      nav_exclude: true

# 生成导航
minima:
  skin: dark
  show_excerpts: true # 显示摘要
  nav_pages:
    - /docs/
    - /examples/
  social_links:
    - name: GitHub
      url: https://github.com/Phil-Fan
    - name: Gmail
      url: mailto:hw.phil.fan@gmail.com
